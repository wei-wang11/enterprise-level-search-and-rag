version: "3.9"

services:
  app:
    build:
      context: .
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./configs:/app/configs:ro
      - ./src:/app/src:ro
    depends_on:
      - qdrant

  frontend:
    image: node:22-alpine
    working_dir: /frontend
    environment:
      VITE_PROXY_TARGET: http://app:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/frontend
    depends_on:
      - app

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./data/qdrant:/qdrant/storage
