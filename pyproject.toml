[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-level-search-and-rag"
version = "0.1.0"
description = "Draft scaffold for an enterprise-grade search and RAG service."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116.0",
  "nltk>=3.9.2",
  "uvicorn[standard]>=0.35.0",
  "pydantic-settings>=2.10.0",
  "pyyaml>=6.0.2",
  "python-multipart>=0.0.20",
  "fastembed>=0.7.1",
  "docling>=2.48.0",
  "openai>=1.75.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.4.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
